<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户认证系统 - 测试页面</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card h2 {
            color: #1f2937;
            margin-bottom: 20px;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 500;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #6b7280;
        }

        .btn-danger {
            background: #ef4444;
        }

        .result-box {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            max-height: 400px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }

        .result-box.success {
            background: #d1fae5;
            border-color: #10b981;
            color: #065f46;
        }

        .result-box.error {
            background: #fee2e2;
            border-color: #ef4444;
            color: #991b1b;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
            margin-left: 10px;
        }

        .status-badge.logged-in {
            background: #d1fae5;
            color: #065f46;
        }

        .status-badge.logged-out {
            background: #fee2e2;
            color: #991b1b;
        }

        .user-info {
            background: #f0f9ff;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 15px;
            margin-top: 15px;
        }

        .user-info p {
            margin: 8px 0;
            font-size: 14px;
            color: #1e40af;
        }

        .user-info strong {
            color: #1e3a8a;
        }

        .settings {
            background: #fffbeb;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .settings h3 {
            font-size: 16px;
            color: #92400e;
            margin-bottom: 10px;
        }

        .settings input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #fbbf24;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .token-display {
            background: #1f2937;
            color: #10b981;
            padding: 10px;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            margin-top: 10px;
            word-break: break-all;
            max-height: 150px;
            overflow-y: auto;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }

        h3 {
            color: #374151;
            font-size: 18px;
            margin: 20px 0 10px 0;
        }

        .divider {
            height: 1px;
            background: #e5e7eb;
            margin: 20px 0;
        }

        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 左侧：注册和登录 -->
        <div class="card">
            <h2>
                🔐 用户认证测试
                <span class="status-badge" id="loginStatus">未登录</span>
            </h2>

            <!-- API 设置 -->
            <div class="settings">
                <h3>⚙️ API 配置</h3>
                <input type="text" id="apiUrl" value="http://127.0.0.1:8000" placeholder="API 地址">
            </div>

            <!-- 用户注册 -->
            <h3>📝 用户注册</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="regUsername" placeholder="3-50个字符">
            </div>
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" id="regEmail" placeholder="example@email.com">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="regPassword" placeholder="至少8个字符">
            </div>
            <div class="form-group">
                <label>全名（可选）</label>
                <input type="text" id="regFullName" placeholder="您的姓名">
            </div>
            <button class="btn" onclick="registerUser()">注册</button>

            <div class="divider"></div>

            <!-- 用户登录 -->
            <h3>🔑 用户登录</h3>
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="loginUsername" placeholder="用户名">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="loginPassword" placeholder="密码">
            </div>
            <button class="btn" onclick="loginUser()">登录</button>

            <!-- 登录结果 -->
            <div id="loginResult"></div>
        </div>

        <!-- 右侧：认证测试 -->
        <div class="card">
            <h2>🧪 API 测试</h2>

            <!-- Token 显示 -->
            <div id="tokenDisplay"></div>

            <!-- 当前用户信息 -->
            <h3>👤 获取当前用户</h3>
            <button class="btn btn-secondary" onclick="getCurrentUser()">GET /api/v1/auth/me</button>
            <div id="userInfoResult"></div>

            <div class="divider"></div>

            <!-- Token 刷新 -->
            <h3>🔄 刷新 Token</h3>
            <button class="btn btn-secondary" onclick="refreshToken()">POST /api/v1/auth/refresh</button>
            <div id="refreshResult"></div>

            <div class="divider"></div>

            <!-- 测试对话接口（使用 JWT） -->
            <h3>💬 测试对话接口（JWT 认证）</h3>
            <div class="form-group">
                <label>测试消息</label>
                <input type="text" id="testMessage" value="你好，请介绍一下自己" placeholder="输入测试消息">
            </div>
            <button class="btn btn-secondary" onclick="testChatWithJWT()">发送对话（使用 JWT）</button>
            <div id="chatResult"></div>

            <div class="divider"></div>

            <!-- 会话管理测试 -->
            <h3>📋 会话管理（Session Management）</h3>
            <div class="action-buttons">
                <button class="btn btn-secondary" onclick="getUserSessions()">获取会话列表</button>
                <button class="btn btn-secondary" onclick="getSessionDetail()">获取会话详情</button>
            </div>
            <div id="sessionResult"></div>

            <div class="divider"></div>

            <!-- 操作按钮 -->
            <div class="action-buttons full-width">
                <button class="btn btn-danger" onclick="logout()">注销登录</button>
                <button class="btn btn-secondary" onclick="clearAllResults()">清空结果</button>
            </div>
        </div>
    </div>

    <script>
        // 全局变量存储 Token
        let accessToken = localStorage.getItem('access_token') || '';
        let refreshTokenValue = localStorage.getItem('refresh_token') || '';
        let currentUser = null;

        // 初始化页面
        window.addEventListener('load', () => {
            updateLoginStatus();
            displayTokens();
            
            // 如果已登录，自动获取用户信息
            if (accessToken) {
                getCurrentUser();
            }
        });

        // 更新登录状态
        function updateLoginStatus() {
            const statusBadge = document.getElementById('loginStatus');
            if (accessToken) {
                statusBadge.textContent = '✓ 已登录';
                statusBadge.className = 'status-badge logged-in';
            } else {
                statusBadge.textContent = '✗ 未登录';
                statusBadge.className = 'status-badge logged-out';
            }
        }

        // 显示 Token
        function displayTokens() {
            const tokenDisplay = document.getElementById('tokenDisplay');
            if (accessToken) {
                tokenDisplay.innerHTML = `
                    <h3>🎫 当前 Token</h3>
                    <div class="token-display">
                        <strong>Access Token:</strong><br>
                        ${accessToken.substring(0, 50)}...
                        <br><br>
                        <strong>Refresh Token:</strong><br>
                        ${refreshTokenValue.substring(0, 50)}...
                    </div>
                `;
            } else {
                tokenDisplay.innerHTML = '<p style="color: #6b7280; text-align: center; margin-top: 20px;">暂无 Token，请先登录</p>';
            }
        }

        // 显示结果
        function showResult(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            const resultClass = isError ? 'error' : 'success';
            element.innerHTML = `<div class="result-box ${resultClass}">${JSON.stringify(data, null, 2)}</div>`;
        }

        // 获取 API URL
        function getApiUrl() {
            return document.getElementById('apiUrl').value.trim();
        }

        // ============================================
        // 用户注册
        // ============================================
        async function registerUser() {
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();
            const fullName = document.getElementById('regFullName').value.trim();

            if (!username || !email || !password) {
                alert('请填写必填字段！');
                return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username,
                        email,
                        password,
                        full_name: fullName || null
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('loginResult', {
                        success: true,
                        message: data.message,
                        tip: '请使用此账号登录'
                    });
                    
                    // 自动填充登录表单
                    document.getElementById('loginUsername').value = username;
                    document.getElementById('loginPassword').value = password;
                } else {
                    showResult('loginResult', {
                        error: data.detail || '注册失败',
                        status: response.status
                    }, true);
                }
            } catch (error) {
                showResult('loginResult', {
                    error: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 用户登录
        // ============================================
        async function loginUser() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                alert('请填写用户名和密码！');
                return;
            }

            try {
                // OAuth2 Password Flow 使用 application/x-www-form-urlencoded
                const formData = new URLSearchParams();
                formData.append('username', username);
                formData.append('password', password);

                const response = await fetch(`${getApiUrl()}/api/v1/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    // 保存 Token
                    accessToken = data.access_token;
                    refreshTokenValue = data.refresh_token;
                    localStorage.setItem('access_token', accessToken);
                    localStorage.setItem('refresh_token', refreshTokenValue);

                    showResult('loginResult', {
                        success: true,
                        message: '登录成功！',
                        token_type: data.token_type,
                        expires_in: data.expires_in + ' 秒',
                        access_token: data.access_token.substring(0, 50) + '...',
                        refresh_token: data.refresh_token.substring(0, 50) + '...'
                    });

                    updateLoginStatus();
                    displayTokens();

                    // 自动获取用户信息
                    setTimeout(() => getCurrentUser(), 500);
                } else {
                    showResult('loginResult', {
                        error: data.detail || '登录失败',
                        status: response.status
                    }, true);
                }
            } catch (error) {
                showResult('loginResult', {
                    error: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 获取当前用户信息
        // ============================================
        async function getCurrentUser() {
            if (!accessToken) {
                showResult('userInfoResult', {
                    error: '请先登录！'
                }, true);
                return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/auth/me`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    currentUser = data;
                    
                    const userInfoHtml = `
                        <div class="user-info">
                            <p><strong>用户 ID:</strong> ${data.user_id}</p>
                            <p><strong>用户名:</strong> ${data.username}</p>
                            <p><strong>邮箱:</strong> ${data.email}</p>
                            <p><strong>全名:</strong> ${data.full_name || '未设置'}</p>
                            <p><strong>状态:</strong> ${data.is_active ? '✅ 激活' : '❌ 禁用'}</p>
                            <p><strong>创建时间:</strong> ${new Date(data.created_at).toLocaleString('zh-CN')}</p>
                        </div>
                    `;
                    document.getElementById('userInfoResult').innerHTML = userInfoHtml;
                } else {
                    if (response.status === 401) {
                        showResult('userInfoResult', {
                            error: 'Token 已过期或无效',
                            tip: '请重新登录或刷新 Token'
                        }, true);
                    } else {
                        showResult('userInfoResult', {
                            error: data.detail || '获取用户信息失败',
                            status: response.status
                        }, true);
                    }
                }
            } catch (error) {
                showResult('userInfoResult', {
                    error: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 刷新 Token
        // ============================================
        async function refreshToken() {
            if (!refreshTokenValue) {
                showResult('refreshResult', {
                    error: '没有可用的 Refresh Token，请重新登录'
                }, true);
                return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/auth/refresh`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        refresh_token: refreshTokenValue
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    // 更新 Token
                    accessToken = data.access_token;
                    refreshTokenValue = data.refresh_token;
                    localStorage.setItem('access_token', accessToken);
                    localStorage.setItem('refresh_token', refreshTokenValue);

                    showResult('refreshResult', {
                        success: true,
                        message: 'Token 刷新成功！',
                        new_access_token: data.access_token.substring(0, 50) + '...',
                        new_refresh_token: data.refresh_token.substring(0, 50) + '...',
                        expires_in: data.expires_in + ' 秒'
                    });

                    displayTokens();
                } else {
                    showResult('refreshResult', {
                        error: data.detail || 'Token 刷新失败',
                        status: response.status
                    }, true);
                }
            } catch (error) {
                showResult('refreshResult', {
                    error: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 测试对话接口（使用 JWT 认证）
        // ============================================
        async function testChatWithJWT() {
            if (!accessToken) {
                showResult('chatResult', {
                    error: '请先登录获取 JWT Token！'
                }, true);
                return;
            }

            const message = document.getElementById('testMessage').value.trim();
            if (!message) {
                alert('请输入测试消息！');
                return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${accessToken}`  // 使用 JWT Token 而非 API Key
                    },
                    body: JSON.stringify({
                        message: message,
                        session_id: 'jwt_test_' + Date.now(),
                        user_id: currentUser?.user_id || 'test_user',
                        stream: false
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('chatResult', {
                        success: true,
                        response: data.response,
                        metadata: data.metadata
                    });
                } else {
                    if (response.status === 401) {
                        showResult('chatResult', {
                            error: 'JWT Token 无效或已过期',
                            tip: '请刷新 Token 或重新登录',
                            detail: data.detail
                        }, true);
                    } else {
                        showResult('chatResult', {
                            error: data.detail || '对话请求失败',
                            status: response.status
                        }, true);
                    }
                }
            } catch (error) {
                showResult('chatResult', {
                    error: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 获取用户会话列表
        // ============================================
        async function getUserSessions() {
            if (!accessToken) {
                alert('请先登录！');
                showResult('sessionResult', { error: '未登录' }, true);
                return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/conversation/sessions/?page=1&page_size=10`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('sessionResult', {
                        message: '✅ 获取会话列表成功',
                        total: data.total,
                        page: data.page,
                        page_size: data.page_size,
                        has_more: data.has_more,
                        sessions: data.sessions.map(s => ({
                            session_id: s.session_id,
                            status: s.status,
                            message_count: s.message_count,
                            created_at: s.created_at,
                            last_activity: s.last_activity
                        }))
                    });
                    
                    // 保存第一个 session_id 用于后续测试
                    if (data.sessions && data.sessions.length > 0) {
                        window.lastSessionId = data.sessions[0].session_id;
                        console.log('Saved session_id for detail test:', window.lastSessionId);
                    }
                } else {
                    showResult('sessionResult', {
                        error: '获取会话列表失败',
                        status: response.status,
                        detail: data
                    }, true);
                }
            } catch (error) {
                showResult('sessionResult', {
                    error: '网络错误',
                    message: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 获取会话详情
        // ============================================
        async function getSessionDetail() {
            if (!accessToken) {
                alert('请先登录！');
                showResult('sessionResult', { error: '未登录' }, true);
                return;
            }

            // 使用上次保存的 session_id 或提示用户输入
            let sessionId = window.lastSessionId;
            if (!sessionId) {
                sessionId = prompt('请输入 Session ID (或先点击"获取会话列表"):');
                if (!sessionId) return;
            }

            try {
                const response = await fetch(`${getApiUrl()}/api/v1/conversation/sessions/${sessionId}`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${accessToken}`,
                        'Content-Type': 'application/json'
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showResult('sessionResult', {
                        message: '✅ 获取会话详情成功',
                        session_id: data.session_id,
                        status: data.status,
                        total_messages: data.total_messages,
                        created_at: data.created_at,
                        last_activity: data.last_activity,
                        messages: data.messages.map(m => ({
                            role: m.role,
                            content: m.content.substring(0, 100) + (m.content.length > 100 ? '...' : ''),
                            created_at: m.created_at
                        }))
                    });
                } else {
                    showResult('sessionResult', {
                        error: '获取会话详情失败',
                        status: response.status,
                        detail: data
                    }, true);
                }
            } catch (error) {
                showResult('sessionResult', {
                    error: '网络错误',
                    message: error.message,
                    type: 'NetworkError'
                }, true);
            }
        }

        // ============================================
        // 注销登录
        // ============================================
        function logout() {
            if (confirm('确定要注销登录吗？')) {
                accessToken = '';
                refreshTokenValue = '';
                currentUser = null;
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');

                updateLoginStatus();
                displayTokens();
                
                document.getElementById('userInfoResult').innerHTML = '';
                showResult('loginResult', {
                    message: '已注销登录'
                });
            }
        }

        // 清空所有结果
        function clearAllResults() {
            document.getElementById('loginResult').innerHTML = '';
            document.getElementById('userInfoResult').innerHTML = '';
            document.getElementById('refreshResult').innerHTML = '';
            document.getElementById('chatResult').innerHTML = '';
            document.getElementById('sessionResult').innerHTML = '';
        }
    </script>
</body>
</html>
