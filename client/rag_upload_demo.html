<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RAG 文档上传演示</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
    }

    body {
      margin: 0;
      padding: 0 1.5rem 2rem;
      background: #f7f9fb;
      color: #1f2933;
    }

    main {
      max-width: 720px;
      margin: 2rem auto;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 35, 95, 0.12);
      padding: 2.5rem;
    }

    h1 {
      font-size: 1.9rem;
      color: #203a8f;
      margin-top: 0;
      margin-bottom: 0.75rem;
    }

    p.description {
      margin-top: 0;
      margin-bottom: 2rem;
      color: #425466;
    }

    fieldset {
      border: 1px solid #d0d7e2;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      background: #f9fbff;
    }

    legend {
      padding: 0 0.5rem;
      font-weight: 600;
      color: #2f4ea2;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    label {
      font-weight: 600;
      color: #31425d;
    }

    input[type="text"],
    textarea,
    select {
      border: 1px solid #cbd2e0;
      border-radius: 10px;
      padding: 0.65rem 0.75rem;
      font-size: 0.95rem;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input[type="text"]:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #3a63d0;
      box-shadow: 0 0 0 3px rgba(58, 99, 208, 0.2);
    }

    input[type="file"] {
      padding: 0.35rem 0;
      font-size: 0.95rem;
    }

    .hint {
      font-size: 0.85rem;
      color: #5c6a7d;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #3a63d0, #274bb6);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 0.7rem 1.6rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(42, 79, 187, 0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 26px rgba(42, 79, 187, 0.35);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    progress {
      width: 100%;
      height: 12px;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    progress::-webkit-progress-bar {
      background-color: #e3e9f6;
    }

    progress::-webkit-progress-value {
      background: linear-gradient(135deg, #3a63d0, #47a6ff);
    }

    progress::-moz-progress-bar {
      background: linear-gradient(135deg, #3a63d0, #47a6ff);
    }

    pre {
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 1rem;
      overflow-x: auto;
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .toast {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      background: rgba(15, 23, 42, 0.92);
      color: #f8fafc;
      padding: 0.85rem 1.2rem;
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
      opacity: 0;
      transform: translateY(-12px);
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      font-size: 0.95rem;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #5f6b7d;
      text-align: center;
    }
  </style>
</head>
<body>
  <main>
    <h1>📚 RAG 文档上传演示</h1>
    <p class="description">请选择 Markdown / PDF / DOCX 文件，上传后端会自动切片、生成向量并写入 Qdrant。</p>

    <form id="upload-form">
      <fieldset>
        <legend>上传设置</legend>

        <div class="form-row">
          <label for="endpoint">接口地址</label>
          <input
            type="text"
            id="endpoint"
            name="endpoint"
            value="http://127.0.0.1:8000/api/v1/rag/upload"
            required
          />
          <span class="hint">默认指向本地运行的 FastAPI 服务，如部署在服务器请替换为对应域名。</span>
        </div>

        <div class="form-row">
          <label for="api-key">X-API-Key（如启用鉴权，可填）</label>
          <input
            type="text"
            id="api-key"
            name="apiKey"
            placeholder="可留空"
          />
        </div>

        <div class="form-row">
          <label for="files">选择文件</label>
          <input
            type="file"
            id="files"
            name="files"
            accept=".md,.markdown,.mdx,.txt,.pdf,.docx"
            multiple
            required
          />
          <span class="hint">一次可选多个文件，单个文件大小受后端 <code>VOICE_AGENT_RAG__MAX_UPLOAD_SIZE_MB</code> 限制（默认 20MB）。</span>
        </div>
      </fieldset>

      <button type="submit" id="submit-btn">🚀 上传并入库</button>
    </form>

    <section id="progress-section" hidden>
      <h2>上传进度</h2>
      <progress id="upload-progress" value="0" max="100"></progress>
      <p id="status-text">准备上传…</p>
    </section>

    <section id="result-section" hidden>
      <h2>响应结果</h2>
      <pre id="result-output">等待响应…</pre>
    </section>

    <footer>
      完成后可结合 <code>GET /api/v1/health</code>、Qdrant 控制台或对话接口验证检索效果。
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
    const form = document.getElementById("upload-form");
    const filesInput = document.getElementById("files");
    const endpointInput = document.getElementById("endpoint");
    const apiKeyInput = document.getElementById("api-key");
    const submitBtn = document.getElementById("submit-btn");
    const progressSection = document.getElementById("progress-section");
    const progressBar = document.getElementById("upload-progress");
    const statusText = document.getElementById("status-text");
    const resultSection = document.getElementById("result-section");
    const resultOutput = document.getElementById("result-output");
    const toast = document.getElementById("toast");

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add("visible");
      setTimeout(() => {
        toast.classList.remove("visible");
      }, 2200);
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!filesInput.files.length) {
        showToast("请至少选择一个文件");
        return;
      }

      const endpoint = endpointInput.value.trim();
      if (!endpoint) {
        showToast("请输入有效的接口地址");
        return;
      }

      const formData = new FormData();
      Array.from(filesInput.files).forEach((file) => {
        formData.append("files", file, file.name);
      });

      progressSection.hidden = false;
      resultSection.hidden = true;
      progressBar.value = 0;
      statusText.textContent = "上传中…";
      submitBtn.disabled = true;

      try {
        const response = await uploadWithProgress(endpoint, formData, apiKeyInput.value.trim());
        statusText.textContent = response.ok ? "上传成功" : "上传失败";

        const payload = await response.json().catch(() => ({ detail: "无法解析响应" }));
        resultOutput.textContent = JSON.stringify(payload, null, 2);
        resultSection.hidden = false;

        if (response.ok) {
          showToast("上传成功，文档已提交入库");
        } else {
          showToast(`上传失败：${response.status}`);
        }
      } catch (error) {
        console.error(error);
        statusText.textContent = "上传异常";
        resultOutput.textContent = String(error);
        resultSection.hidden = false;
        showToast("上传过程中发生异常");
      } finally {
        submitBtn.disabled = false;
      }
    });

    async function uploadWithProgress(endpoint, formData, apiKey) {
      const xhr = new XMLHttpRequest();

      const promise = new Promise((resolve, reject) => {
        xhr.open("POST", endpoint, true);
        if (apiKey) {
          xhr.setRequestHeader("X-API-Key", apiKey);
        }

        xhr.upload.onprogress = (event) => {
          if (event.lengthComputable) {
            const percent = Math.round((event.loaded / event.total) * 100);
            progressBar.value = percent;
            statusText.textContent = `上传进度：${percent}%`;
          }
        };

        xhr.onreadystatechange = () => {
          if (xhr.readyState === XMLHttpRequest.DONE) {
            const response = new Response(xhr.response, {
              status: xhr.status,
              statusText: xhr.statusText,
              headers: parseHeaders(xhr.getAllResponseHeaders()),
            });
            resolve(response);
          }
        };

        xhr.onerror = () => {
          reject(new Error("网络错误或后端无法访问"));
        };
      });

      xhr.send(formData);
      return promise;
    }

    function parseHeaders(rawHeaders) {
      const headers = new Headers();
      rawHeaders.trim().split(/\r?\n/).forEach((line) => {
        const [key, ...rest] = line.split(":");
        if (key) {
          headers.append(key.trim(), rest.join(":").trim());
        }
      });
      return headers;
    }
  </script>
</body>
</html>
